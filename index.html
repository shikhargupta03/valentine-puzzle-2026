<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Puzzle ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>💖 Solve the Puzzle 💖</h1>

<select id="difficulty">
    <option value="4">Easy (4x4)</option>
    <option value="6">Medium (6x6)</option>
    <option value="8" selected>Hard (8x8)</option>
</select>

<button onclick="startGame()">Start Game</button>

<div id="puzzle"></div>

<div id="countdown" class="hidden"></div>

<div id="message" class="hidden">
    <h2>❤️ Happy Valentine Day ❤️</h2>
    <button onclick="shareWhatsApp()">Share Love 💌</button>
</div>

<script src="script.js"></script>
</body>
</html>
